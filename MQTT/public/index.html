<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Subscriber Dashboard</title>
    <style>
        /* CSS 樣式設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .dashboard-container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }

        .card {
            background: #f8f9fa;
            border-left: 5px solid #3498db;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        /* 針對不同變數給予不同的左側邊框顏色，增加豐富度 */
        #card_a { border-left-color: #3498db; }
        #card_b { border-left-color: #2ecc71; }
        #card_c { border-left-color: #e74c3c; }

        .variable {
            font-size: 1.1rem;
            font-weight: 600;
            color: #34495e;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>MQTT Dashboard</h1>
        
        <div class="card" id="card_a">
            <span class="variable" id="variable_a">Variable A: 0</span>
        </div>
        <div class="card" id="card_b">
            <span class="variable" id="variable_b">Variable B: 0</span>
        </div>
        <div class="card" id="card_c">
            <span class="variable" id="variable_c">Variable C: 0</span>
        </div>
    </div>
    <script >
        async function fetchInitialValue(){
            try{
                const response = await fetch('/api/values');
                const data = await response.json();

                document.getElementById('variable_a').innerText = `Variable A: ${data.variable_a}`;
                document.getElementById('variable_b').innerText = `Variable B: ${data.variable_b}`;
                document.getElementById('variable_c').innerText = `Variable C: ${data.variable_c}`;
            }
            catch(error){
                console.error('Error fetching initial values:', error);
            }
        }
        // 1. 網頁一打開先跑一次
        fetchInitialValue();

        // 2. 每隔 1 秒（1000 毫秒）自動去伺服器抓一次最新資料（實現即時跳動）
        setInterval(fetchInitialValue, 1000);
    </script>
</body>
</html>
